name: Deploy

on:
  push:
    tags:
      - 'v*-dev'
      - 'v*-prod'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target project
        id: target
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-dev)
              echo "project=minorlab-links-dev" >> "$GITHUB_OUTPUT"
              ;;
            *-prod)
              echo "project=minorlab-links" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown tag suffix: $TAG" >&2
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT: ${{ steps.target.outputs.project }}
          TAG: ${{ github.ref_name }}
        run: pnpm dlx wrangler@4 pages deploy .svelte-kit/cloudflare --project-name="$PROJECT" --commit-message="$TAG" --commit-dirty=true
